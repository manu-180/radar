name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Mismo orden que `npm run verify`. No corre `npm run eval`: esa hace
      # llamadas reales a Claude (cuesta dinero y exige ANTHROPIC_API_KEY).
      # `next lint` se eliminó en Next.js 16 — se usa el ESLint CLI directamente.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
