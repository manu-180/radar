name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Mismo orden que `npm run verify`. No corre `npm run eval`: esa hace
      # llamadas reales a Claude (cuesta dinero y exige ANTHROPIC_API_KEY).
      # `next lint` se eliminó en Next.js 16 — se usa el ESLint CLI directamente.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        # next build evalúa lib/env al recolectar páginas; en CI no hay secretos
        # reales, así que se pasan placeholders de formato válido (Vercel inyecta
        # los reales en prod). Sin esto, env.ts lanza y el build falla.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-key
          SUPABASE_SERVICE_ROLE_KEY: service-role-key
          ANTHROPIC_API_KEY: sk-ant-test
          EVOLUTION_API_URL: https://evolution.example.com
          EVOLUTION_API_KEY: evolution-key
          EVOLUTION_INSTANCE: wa-test
          OWNER_WHATSAPP: "+5491112345678"
          CRON_SECRET: cron-secret-aleatorio-largo-1234
          AUTH_SECRET: auth-secret-aleatorio-largo-1234
          REDDIT_USER_AGENT: lead-detector/1.0
          DASHBOARD_PASSWORD: dashboard-password
          APP_URL: http://localhost:3000

  # El worker del firehose es un paquete aparte (Railway), fuera del build de la
  # app. Importa lib/filter/* del repo, así que un cambio en esos módulos podría
  # romperlo sin que el job de arriba lo note: este job lo cubre por separado.
  worker:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: worker-firehose

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker-firehose/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
